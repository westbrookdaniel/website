<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102820" />
    <title>Cards — Playground</title>
    <style>
      :root { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: #1b1b1a; background: #f3f2ee; --surface: #f3f2ee; --ink: #1b1b1a; --muted: #696964; --line: #c6c6bf; --felt: #e6e7df; --paper: #fffefa; --red: #9e3630; --card-shadow: 0 2px 5px #16161521; color-scheme: light; }
      :root[data-theme="dark"] { color: #f1f0eb; background: #1d2422; --surface: #1d2422; --ink: #f1f0eb; --muted: #b2bbb4; --line: #626b64; --felt: #26322b; --paper: #fdfbf5; --red: #9e3630; --card-shadow: 0 3px 7px #0006; color-scheme: dark; }
      * { box-sizing: border-box; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      body { margin: 0; min-width: 280px; background: var(--surface); color: var(--ink); }
      button, select { font: inherit; }
      button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:disabled { cursor: default; opacity: .52; }
      button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      a { color: inherit; }
      .shell { width: min(100%, 1100px); margin: auto; padding: 0 14px calc(30px + env(safe-area-inset-bottom)); }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 62px; border-bottom: 1px solid var(--line); }
      .brand { font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; text-decoration: none; }
      .topbar a:last-child { font-size: 11px; text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
      .home-intro { padding: 33px 2px 27px; display: flex; justify-content: space-between; align-items: end; gap: 20px; }
      h1 { font-size: clamp(42px, 12vw, 88px); line-height: .86; letter-spacing: -.09em; text-transform: uppercase; margin: 0; }
      .home-intro p { max-width: 210px; margin: 0 0 4px; color: var(--muted); font-size: 11px; line-height: 1.55; text-align: right; }
      .overline { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
      .game-list { display: grid; gap: 10px; padding-top: 18px; }
      .game-option { min-height: 122px; border: 1px solid var(--ink); padding: 17px; background: var(--felt); box-shadow: 3px 3px 0 var(--ink); display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .game-option h2 { margin: 9px 0 8px; font-size: clamp(20px, 6vw, 30px); letter-spacing: -.05em; }
      .game-option p { max-width: 44ch; margin: 0; font-size: 11px; line-height: 1.45; color: var(--muted); }
      .difficulty { text-align: right; font-size: 10px; color: var(--muted); }
      .option-actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .option-actions button { min-height: 38px; padding: 0 13px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); font-size: 11px; font-weight: 700; }
      .option-actions button[data-resume] { background: transparent; color: var(--ink); }
      [hidden] { display: none !important; }
      .game-head { padding: 22px 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .game-head h1 { font-size: clamp(18px, 5vw, 24px); letter-spacing: -.04em; }
      .game-head p { color: var(--muted); font-size: 10px; margin: 7px 0 0; }
      .text-button { border: 0; background: transparent; color: var(--ink); border-bottom: 1px solid var(--ink); padding: 7px 1px; font-size: 11px; }
      .toolbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding-bottom: 13px; }
      .toolbar button { min-height: 42px; padding: 3px 2px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: clamp(9px, 2.6vw, 11px); }
      .toolbar button:hover:not(:disabled), .text-button:hover { background: var(--felt); }
      .board { min-height: 470px; padding: 12px 8px 28px; border: 1px solid var(--ink); background: var(--felt); box-shadow: 4px 4px 0 var(--ink); overflow: hidden; }
      .top-piles { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; align-items: start; }
      .klondike .top-piles { grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .pile, .stock, .place, .card { width: 100%; aspect-ratio: .72; border-radius: 4px; }
      .pile-spacer { min-width: 0; }
      .stock, .place { display: grid; place-items: center; border: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: clamp(8px, 2.1vw, 11px); }
      .stock.down, .card.down { border: 1px solid #252724; color: #333; background: var(--paper); }
      .back-mark { width: calc(100% - 8px); height: calc(100% - 8px); display: grid; place-items: center; border: 1px solid #aaa99f; background: repeating-linear-gradient(45deg, #e9e8e1 0 2px, #fdfbf5 2px 5px); font-size: 18px; }
      :root[data-back="dots"] .back-mark { background: radial-gradient(#aaa99f 1px, #fdfbf5 1.4px); background-size: 6px 6px; }
      .card { position: relative; display: block; padding: 4px; text-align: left; border: 1px solid #dedbd3; background: var(--paper); box-shadow: var(--card-shadow); line-height: 1; transition: transform .16s ease, box-shadow .16s ease; }
      .card:not(:disabled):hover { transform: translateY(-3px); }
      .card.red { color: var(--red); }
      .card.black { color: #171717; }
      .rank { display: flex; flex-direction: column; align-items: start; gap: 1px; font-size: clamp(11px, 3.3vw, 18px); font-weight: 800; }
      .rank small { font-size: .85em; }
      .pip { position: absolute; right: 4px; bottom: 4px; font-size: clamp(14px, 4vw, 25px); }
      .card.selected { outline: 3px solid var(--ink); outline-offset: -2px; transform: translateY(-7px); z-index: 3; }
      .card.target, .place.target { outline: 2px solid var(--ink); outline-offset: 2px; animation: nudge 1.5s ease-in-out infinite; }
      .columns { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; margin-top: 20px; }
      .klondike .columns { grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .column { position: relative; min-width: 0; }
      .stack-card { position: absolute; width: 100%; left: 0; }
      .stack-card .card { min-height: 46px; }
      .pyramid-grid { padding: 9px 0 25px; }
      .pyramid-row { display: flex; justify-content: center; gap: 3px; position: relative; }
      .pyramid-row + .pyramid-row { margin-top: -22px; }
      .pyramid-slot { width: min(calc((100% - 25px) / 7), 67px); aspect-ratio: .72; }
      .pyramid-slot .card { height: 100%; }
      .pyramid-slot .card:disabled { opacity: 1; cursor: default; }
      .pyramid-stock { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 17px 3px 0; }
      .pyramid-stock > .stock, .pyramid-stock > .pile { width: min(13%, 67px); min-width: 35px; }
      .pyramid-stock p { margin-left: auto; max-width: 120px; font-size: 10px; line-height: 1.4; text-align: right; color: var(--muted); }
      .status { min-height: 44px; margin: 0; padding: 17px 0 0; font-size: 11px; line-height: 1.4; color: var(--muted); }
      .footer { padding: 18px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
      #app[data-screen="home"] #game-screen, #app[data-screen="game"] #home-screen { display: none; }
      dialog { width: min(calc(100vw - 30px), 480px); max-height: min(86dvh, 750px); overflow: auto; padding: 29px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); box-shadow: 6px 6px 0 var(--ink); }
      dialog::backdrop { background: #101310ad; }
      dialog h2 { margin: 10px 0 18px; font-size: clamp(27px, 9vw, 42px); line-height: 1; letter-spacing: -.07em; }
      dialog p, dialog li { font-size: 12px; line-height: 1.6; }
      dialog p { color: var(--muted); }
      #dialog-close { float: right; border: 0; background: transparent; color: var(--ink); font-size: 20px; }
      .dialog-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 23px; }
      .dialog-actions button { min-height: 42px; padding: 0 15px; border: 1px solid var(--ink); background: transparent; color: var(--ink); font-size: 11px; }
      .dialog-actions .primary { background: var(--ink); color: var(--surface); }
      .rule-list { padding-left: 20px; }
      .rule-list li + li { margin-top: 9px; }
      .settings-list { display: grid; gap: 4px; }
      .settings-list label { min-height: 48px; display: flex; justify-content: space-between; align-items: center; gap: 15px; border-bottom: 1px solid var(--line); font-size: 11px; }
      .settings-list select { max-width: 130px; padding: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 11px; }
      .settings-list input { width: 20px; height: 20px; accent-color: var(--ink); }
      .fine-print { font-size: 10px; }
      .practice { display: flex; gap: 20px; align-items: center; margin: 22px 0; }
      .practice > * { width: 64px; }
      .practice .place { height: 87px; }
      .win-mark { font-size: 50px; line-height: 1; animation: arrive .8s ease both; }
      @keyframes nudge { 50% { box-shadow: 0 0 0 5px #8c9c8c55; } }
      @keyframes arrive { from { opacity: 0; transform: translateY(8px) rotate(-20deg); } }
      @media (min-width: 700px) {
        .shell { padding-left: 30px; padding-right: 30px; }
        .game-list { grid-template-columns: repeat(3, 1fr); }
        .game-option { min-height: 170px; align-content: start; }
        .option-actions { align-self: end; }
        .board { padding: 24px; min-height: 620px; }
        .top-piles, .columns { gap: 9px; }
        .columns { margin-top: 36px; }
        .stack-card .card { min-height: 70px; }
        .pyramid-row { gap: 8px; }
        .pyramid-row + .pyramid-row { margin-top: -39px; }
        .pyramid-grid { padding-bottom: 50px; }
        .rank { font-size: 18px; }
        .pip { font-size: 26px; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
      .reduced *, .reduced *::before, .reduced *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
      /* The table fills the viewport; the controls stay within thumb reach. */
      :root { --surface: #eeeae0; --ink: #253a31; --muted: #5f6c62; --line: #b9c3b7; --felt: #d9dfd3; --paper: #fffdf8; --accent: #7a6842; }
      :root[data-theme="dark"] { --surface: #102820; --ink: #f6f2e7; --muted: #b1c4b5; --line: #4d6c59; --felt: #194435; --paper: #fffdf7; --accent: #d8bf81; }
      .shell { width: min(100%, 1240px); height: 100dvh; min-height: 480px; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); }
      main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #home-screen, #game-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .game-list { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 11px; padding: 0 0 8px; overflow: auto; }
      .game-option { position: relative; min-height: 140px; overflow: hidden; padding: clamp(16px, 4.5vw, 26px); border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(145deg, #ffffff0e, transparent 65%), var(--felt); box-shadow: inset 0 1px #ffffff24, 0 8px 20px #06170e16; align-content: space-between; }
      .game-option::before { content: ""; position: absolute; right: 13%; top: 36%; width: 84px; aspect-ratio: .72; border: 1px solid var(--accent); border-radius: 9px; opacity: .16; transform: rotate(-11deg); pointer-events: none; }
      .game-option::after { content: "♠"; position: absolute; right: 21%; top: 31%; width: 84px; aspect-ratio: .72; display: grid; place-items: center; border: 1px solid currentColor; border-radius: 9px; color: var(--accent); opacity: .26; font: 42px Georgia, serif; transform: rotate(13deg); pointer-events: none; }
      .game-option:nth-child(2)::after { content: "♣"; transform: rotate(-10deg); }
      .game-option:nth-child(3)::after { content: "♦"; transform: rotate(8deg); }
      .game-option h2 { margin: 0 0 6px; font: 600 clamp(25px, 7vw, 36px)/1.05 Georgia, serif; letter-spacing: -.045em; }
      .game-option p { max-width: 31ch; font-size: 11px; line-height: 1.35; }
      .difficulty { color: var(--accent); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .option-actions { margin-top: 4px; }
      .option-actions button { min-height: 40px; border: 1px solid var(--accent); border-radius: 999px; padding: 0 17px; background: var(--accent); color: #102820; font-weight: 800; }
      .option-actions button[data-resume] { border-color: var(--line); color: var(--ink); background: transparent; }
      .game-head { flex-shrink: 0; padding: 5px 4px 12px; min-height: 56px; }
      .game-head h1 { margin: 0; font: 600 clamp(20px, 5vw, 28px)/1 Georgia, serif; letter-spacing: -.04em; text-transform: none; }
      .game-head p { margin: 5px 0 0; font-size: 10px; }
      .text-button { min-height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; text-decoration: none; }
      .toolbar { order: 2; position: relative; z-index: 5; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 8px 0 0; background: var(--surface); }
      .toolbar button { min-height: 58px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font-size: 10px; }
      .toolbar button:active:not(:disabled) { background: var(--felt); transform: scale(.96); }
      .toolbar .icon { font-size: 22px; line-height: 1; color: var(--accent); }
      .board { order: 1; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; border: 1px solid var(--line); border-radius: 18px; padding: clamp(12px, 3vw, 26px); background: radial-gradient(ellipse at 50% -20%, #ffffff15, transparent 65%), var(--felt); box-shadow: inset 0 1px #ffffff28, 0 8px 24px #00130d24; }
      .top-piles, .columns { width: 100%; max-width: 870px; margin-left: auto; margin-right: auto; gap: 4px; }
      .columns { margin-top: 23px; }
      .pile, .stock, .place, .card { border-radius: 7px; }
      .stock, .place { border-color: var(--line); color: var(--muted); }
      .stock.down, .card.down { border-color: #e0dacf; }
      .card.down:disabled { opacity: 1; }
      .card { border-color: #e4ded2; background: linear-gradient(150deg, #fffefa, #f9f6ee); box-shadow: 0 2px 4px #00160e38, 0 6px 12px #00160e14; }
      .rank { font-family: Georgia, serif; }
      .pip { font-family: Georgia, serif; }
      .card.selected { outline: 3px solid var(--accent); box-shadow: 0 9px 14px #00160e60; }
      .card.target, .place.target { outline-color: var(--accent); }
      .back-mark { border-color: #9b8b6b; color: #8e7751; background: repeating-linear-gradient(45deg, #e6ddc8 0 2px, #f8f3e9 2px 5px); }
      :root[data-back="dots"] .back-mark { background: radial-gradient(#a5987d 1px, #f8f3e9 1.5px); background-size: 6px 6px; }
      .pyramid-grid { padding-top: 4px; }
      .pyramid-stock { border-color: var(--line); }
      .status { flex-shrink: 0; min-height: 25px; padding: 7px 3px 0; font-size: 11px; }
      dialog { border: 1px solid var(--line); border-radius: 20px; padding: 27px; box-shadow: 0 24px 70px #0008; }
      dialog h2 { font-family: Georgia, serif; letter-spacing: -.045em; }
      .dialog-actions button { border-radius: 999px; }
      .dialog-actions .primary { background: var(--accent); border-color: var(--accent); color: #102820; }
      @media (max-height: 620px) and (max-width: 699px) {
        .game-option { min-height: 130px; }
        .toolbar button { min-height: 49px; }
        .toolbar .icon { font-size: 18px; }
      }
      @media (min-width: 700px) {
        .shell { padding: 22px 28px; }
        .game-list { grid-template-columns: repeat(3, 1fr); grid-template-rows: minmax(260px, 410px); align-content: center; gap: 16px; }
        .game-option { min-height: 0; }
        .game-option::before, .game-option::after { width: 100px; top: 36%; }
        .game-option::after { font-size: 48px; }
        .game-head { padding-bottom: 16px; }
        .toolbar { max-width: 560px; align-self: center; width: 100%; }
        .board { padding: 26px; }
        .top-piles, .columns { gap: 9px; }
        .columns { margin-top: 30px; }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="app" data-screen="home">
      <main>
        <section id="home-screen" aria-labelledby="home-title">
          <h1 id="home-title" class="sr-only">Cards</h1>
          <div class="game-list">
            <article class="game-option"><div><h2>Solitaire</h2><p>Klondike · build four foundations.</p></div><span class="difficulty">Medium</span><div class="option-actions"><button data-new="klondike">New game</button><button data-resume="klondike" hidden>Resume</button></div></article>
            <article class="game-option"><div><h2>FreeCell</h2><p>All cards visible · plan with four free cells.</p></div><span class="difficulty">Hard</span><div class="option-actions"><button data-new="freecell">New game</button><button data-resume="freecell" hidden>Resume</button></div></article>
            <article class="game-option"><div><h2>Pyramid</h2><p>Pair cards that add to thirteen.</p></div><span class="difficulty">Medium</span><div class="option-actions"><button data-new="pyramid">New game</button><button data-resume="pyramid" hidden>Resume</button></div></article>
          </div>
        </section>
        <section id="game-screen" aria-labelledby="game-title">
          <div class="game-head"><div><h1 id="game-title">Solitaire</h1><p id="move-count">0 moves</p></div><button class="text-button" id="all-games">All games</button></div>
          <nav class="toolbar" aria-label="Game controls"><button id="new-deal" aria-label="New deal"><span class="icon" aria-hidden="true">↻</span>Deal</button><button id="undo"><span class="icon" aria-hidden="true">↶</span>Undo</button><button id="hint"><span class="icon" aria-hidden="true">✦</span>Hint</button><button id="rules"><span class="icon" aria-hidden="true">?</span>Rules</button><button id="settings"><span class="icon" aria-hidden="true">⚙</span>Settings</button></nav>
          <div id="board" class="board" aria-label="Card table"></div>
        </section>
      </main>
      <p class="status" id="toast" role="status" aria-live="polite"></p>
    </div>
    <dialog id="dialog" aria-label="Cards dialog"><button id="dialog-close" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog>
    <script type="module" src="/public/cards.js"></script>
  </body>
</html>
